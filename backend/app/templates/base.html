<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DoorLink — Dashboard Admin Sistem Akses Pintu IoT">
    <title>{% block title %}DoorLink Dashboard{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font — Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>

<!-- ── Sidebar ────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-door-open-fill"></i>
        <span>DoorLink</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="sidebar-link {% if page == 'home' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>
        <a href="/dashboard/users" class="sidebar-link {% if page == 'users' %}active{% endif %}">
            <i class="bi bi-people-fill"></i><span>Users</span>
        </a>
        <a href="/dashboard/logs" class="sidebar-link {% if page == 'logs' %}active{% endif %}">
            <i class="bi bi-journal-text"></i><span>Access Logs</span>
        </a>
        <a href="/dashboard/door" class="sidebar-link {% if page == 'door' %}active{% endif %}">
            <i class="bi bi-shield-lock-fill"></i><span>Door Sim</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/docs" target="_blank" class="sidebar-link">
            <i class="bi bi-code-slash"></i><span>API Docs</span>
        </a>
    </div>
</aside>

<!-- ── Main Content ───────────────────────────────────────── -->
<main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
        <button class="btn btn-sm d-lg-none me-2" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
            <i class="bi bi-list fs-4"></i>
        </button>
        <h1 class="topbar-title">{% block page_title %}Dashboard{% endblock %}</h1>
        <div class="topbar-right">
            <span class="badge bg-light text-dark"><i class="bi bi-router-fill me-1"></i>DoorLink v0.3</span>
        </div>
    </header>

    <!-- Page Content -->
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Sidebar backdrop for mobile -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Sidebar toggle for mobile
    const toggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    if (toggle) {
        toggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('show');
        });
    }
    if (backdrop) {
        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            backdrop.classList.remove('show');
        });
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
