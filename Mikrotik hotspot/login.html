<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DoorLink Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
  <input type="hidden" name="username">
  <input type="hidden" name="password">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>

<script src="md5.js"></script>
<script>
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<main class="page">
  <section class="card">
    <div class="brand">
      <div class="logo">DL</div>
      <div>
        <h1>DoorLink</h1>
        <p>Smart Access System</p>
      </div>
    </div>

    <h2>Masuk ke Jaringan</h2>
    <p class="subtitle">Akses WiFi kost secara aman melalui autentikasi terpusat.</p>

    $(if error)
    <div class="alert">$(error)</div>
    $(endif)

    <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="http://10.10.13.9:8000/dashboard/">
      <input type="hidden" name="popup" value="true">

      <label>Username</label>
      <input name="username" type="text" value="$(username)" placeholder="Username">

      <label>Password</label>
      <input name="password" type="password" placeholder="Password">

      <button type="submit">Connect</button>
    </form>

    <div class="footer">Powered by MikroTik & DoorLink</div>
  </section>
</main>
</body>
</html>
