<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DoorLink — Dashboard Admin Sistem Akses Pintu IoT">
    <title>{% block title %}DoorLink Dashboard{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font — Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Inline DoorLink Glow UI -->

<style>

/* FIXED CORE LAYOUT: jangan bergantung ke /static/style.css */
.sidebar{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:250px!important;z-index:1040!important;display:flex!important;flex-direction:column!important;padding:24px 14px!important}
.sidebar-brand{display:flex!important;align-items:center!important;gap:12px!important;font-size:1.45rem!important;font-weight:900!important;margin-bottom:28px!important;padding:0 10px!important;white-space:nowrap!important}
.sidebar-brand i{font-size:1.8rem!important}.sidebar-nav{display:flex!important;flex-direction:column!important;gap:10px!important;flex:1!important}.sidebar-link{display:flex!important;align-items:center!important;gap:12px!important;text-decoration:none!important;padding:13px 14px!important;font-weight:750!important;white-space:nowrap!important}.sidebar-link i{width:22px!important;text-align:center!important;font-size:1.15rem!important}.sidebar-footer{display:flex!important;flex-direction:column!important;gap:10px!important;border-top:1px solid rgba(125,211,252,.16)!important;padding-top:16px!important;margin-top:16px!important}.main-content{margin-left:250px!important;min-height:100vh!important;width:calc(100% - 250px)!important}.topbar{height:78px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;padding:0 34px!important;position:sticky!important;top:0!important;z-index:1030!important}.topbar-title{font-size:2rem!important;margin:0!important}.content-wrapper{padding:26px 34px 44px!important}.sidebar-backdrop{display:none!important;position:fixed!important;inset:0!important;background:rgba(0,0,0,.58)!important;z-index:1039!important}.sidebar-backdrop.show{display:block!important}.row{position:relative!important;z-index:2!important}.dl-table{margin-bottom:0!important}.card-body{position:relative!important;z-index:1!important}.table-responsive{border-radius:0 0 24px 24px!important}.btn-sm{padding:.45rem .75rem!important}@media(max-width:991px){.sidebar{transform:translateX(-105%)!important;transition:.3s ease!important}.sidebar.open{transform:translateX(0)!important}.main-content{margin-left:0!important;width:100%!important}.topbar{padding:0 18px!important}.content-wrapper{padding:18px!important}.topbar-title{font-size:1.55rem!important}.sidebar-backdrop.show{display:block!important}}

:root{--dl-bg:#06131f;--dl-panel:rgba(255,255,255,.08);--dl-border:rgba(125,211,252,.28);--dl-text:#eaf6ff;--dl-muted:#9fb2c7;--dl-cyan:#22d3ee;--dl-blue:#3b82f6;--dl-green:#22c55e;--dl-red:#f43f5e;--dl-purple:#8b5cf6;--dl-orange:#fb923c}
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif!important;background:radial-gradient(circle at 18% 10%,rgba(34,211,238,.28),transparent 28%),radial-gradient(circle at 88% 18%,rgba(139,92,246,.22),transparent 24%),linear-gradient(135deg,#06131f 0%,#0b1f35 45%,#07111f 100%)!important;color:var(--dl-text)!important;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);animation:gridMove 18s linear infinite}body:after{content:"";position:fixed;inset:-40%;pointer-events:none;background:conic-gradient(from 90deg,transparent,rgba(34,211,238,.12),transparent,rgba(59,130,246,.12),transparent);animation:spinGlow 22s linear infinite}.sidebar{background:rgba(3,12,24,.72)!important;border-right:1px solid var(--dl-border)!important;backdrop-filter:blur(22px);box-shadow:18px 0 60px rgba(34,211,238,.12)!important}.sidebar-brand{color:#fff!important;text-shadow:0 0 24px rgba(34,211,238,.9)}.sidebar-brand i{filter:drop-shadow(0 0 12px rgba(34,211,238,.95))}.sidebar-link{position:relative;color:var(--dl-muted)!important;border-radius:16px!important;transition:.28s ease!important}.sidebar-link:hover,.sidebar-link.active{color:#fff!important;background:linear-gradient(90deg,rgba(34,211,238,.20),rgba(59,130,246,.12))!important;box-shadow:0 0 24px rgba(34,211,238,.18);transform:translateX(4px)}.sidebar-link.active:before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:4px;border-radius:99px;background:var(--dl-cyan);box-shadow:0 0 16px var(--dl-cyan)}.main-content{background:transparent!important;position:relative;z-index:1}.topbar{background:rgba(6,19,31,.62)!important;border-bottom:1px solid rgba(125,211,252,.18)!important;backdrop-filter:blur(18px);box-shadow:0 12px 42px rgba(0,0,0,.18)}.topbar-title{color:#fff!important;font-weight:800!important;letter-spacing:-.03em}.topbar .badge{background:rgba(255,255,255,.10)!important;color:#fff!important;border:1px solid rgba(34,211,238,.25);box-shadow:0 0 24px rgba(34,211,238,.16)}.content-wrapper{animation:pageIn .65s cubic-bezier(.2,.9,.2,1) both}.dl-hero{position:relative;overflow:hidden;border:1px solid var(--dl-border);border-radius:28px;padding:28px;margin-bottom:24px;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(59,130,246,.08),rgba(255,255,255,.06));box-shadow:0 28px 90px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18)}.dl-hero:after{content:"";position:absolute;inset:-60px;background:radial-gradient(circle at 80% 35%,rgba(34,211,238,.28),transparent 30%);animation:floatGlow 5s ease-in-out infinite}.dl-hero h2{font-weight:900;letter-spacing:-.04em;margin:0;color:#fff}.dl-hero p{color:var(--dl-muted);margin:.35rem 0 0}.dl-orb{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,var(--dl-cyan),var(--dl-blue));box-shadow:0 0 38px rgba(34,211,238,.65);animation:orbPulse 2.4s ease-in-out infinite}.stat-card,.dl-card,.card{position:relative;overflow:hidden;background:rgba(255,255,255,.08)!important;border:1px solid rgba(125,211,252,.24)!important;border-radius:24px!important;color:var(--dl-text)!important;backdrop-filter:blur(18px);box-shadow:0 22px 70px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)!important;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}.stat-card:hover,.dl-card:hover,.card:hover{transform:translateY(-7px) scale(1.01);border-color:rgba(34,211,238,.7)!important;box-shadow:0 30px 95px rgba(0,0,0,.34),0 0 42px rgba(34,211,238,.20),inset 0 1px 0 rgba(255,255,255,.18)!important}.stat-card:before,.dl-card:before,.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.18),transparent 80%);transform:translateX(-120%);transition:.7s}.stat-card:hover:before,.dl-card:hover:before,.card:hover:before{transform:translateX(120%)}.stat-card{min-height:132px!important;display:flex!important;align-items:center!important;gap:22px!important;padding:24px!important;animation:cardUp .65s both}.row .col-6:nth-child(1) .stat-card{animation-delay:.04s}.row .col-6:nth-child(2) .stat-card{animation-delay:.11s}.row .col-6:nth-child(3) .stat-card{animation-delay:.18s}.row .col-6:nth-child(4) .stat-card{animation-delay:.25s}.stat-icon{width:66px!important;height:66px!important;border-radius:20px!important;display:grid!important;place-items:center!important;background:rgba(255,255,255,.10)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 30px rgba(34,211,238,.18)}.stat-icon i{font-size:1.8rem!important}.text-blue{color:#38bdf8!important}.text-purple{color:#a78bfa!important}.text-teal{color:#2dd4bf!important}.text-orange{color:#fb923c!important}.bg-blue-subtle,.bg-purple-subtle,.bg-teal-subtle,.bg-orange-subtle{background:rgba(255,255,255,.10)!important}.stat-value{font-size:2.55rem!important;font-weight:900!important;line-height:1;color:#fff!important;text-shadow:0 0 18px rgba(34,211,238,.4)}.stat-label{color:var(--dl-muted)!important;font-weight:700!important}.card-header{background:rgba(255,255,255,.06)!important;border-bottom:1px solid rgba(125,211,252,.18)!important;color:#fff!important}.table{--bs-table-bg:transparent!important;--bs-table-color:var(--dl-text)!important;--bs-table-border-color:rgba(125,211,252,.12)!important;color:var(--dl-text)!important}.table thead th{color:#9fc6df!important;background:rgba(255,255,255,.06)!important;text-transform:uppercase;font-size:.78rem;letter-spacing:.07em}.table tbody tr{transition:.22s ease}.table tbody tr:hover{background:rgba(34,211,238,.09)!important;transform:scale(1.005)}code{color:#f472b6!important}.badge.bg-success{background:linear-gradient(135deg,#16a34a,#22c55e)!important;box-shadow:0 0 18px rgba(34,197,94,.35)}.badge.bg-danger{background:linear-gradient(135deg,#e11d48,#f43f5e)!important;box-shadow:0 0 18px rgba(244,63,94,.35)}.badge.bg-light{background:rgba(255,255,255,.1)!important;color:#eaf6ff!important}.btn{border-radius:14px!important;font-weight:800!important;transition:.25s ease!important}.btn-primary{border:0!important;background:linear-gradient(135deg,#06b6d4,#2563eb)!important;box-shadow:0 0 28px rgba(34,211,238,.32)!important}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 42px rgba(34,211,238,.55)!important}.btn-outline-primary{color:#7dd3fc!important;border-color:rgba(125,211,252,.55)!important}.btn-outline-primary:hover{background:rgba(34,211,238,.15)!important;box-shadow:0 0 28px rgba(34,211,238,.25)}.form-control,.form-select{background:rgba(255,255,255,.08)!important;border:1px solid rgba(125,211,252,.24)!important;color:#fff!important;border-radius:14px!important}.form-control:focus,.form-select:focus{border-color:var(--dl-cyan)!important;box-shadow:0 0 0 .25rem rgba(34,211,238,.18),0 0 24px rgba(34,211,238,.24)!important}.form-label{color:#cde7f7!important;font-weight:700}.text-muted{color:var(--dl-muted)!important}.door-visual{width:150px;height:190px;margin:0 auto 18px;position:relative;perspective:650px}.door-frame{position:absolute;inset:0;border:5px solid rgba(125,211,252,.45);border-radius:14px;box-shadow:0 0 30px rgba(34,211,238,.22)}.door-panel{position:absolute;inset:10px;background:linear-gradient(135deg,#0ea5e9,#1e3a8a);border-radius:10px;transform-origin:left center;box-shadow:0 0 35px rgba(34,211,238,.28);transition:1s cubic-bezier(.2,.9,.2,1)}.door-panel:after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-radius:50%;background:#fde68a;box-shadow:0 0 18px #fde68a}.result-allowed .door-panel,.access-allowed .door-panel{transform:rotateY(-58deg)}.result-denied .door-visual,.access-denied .door-visual{animation:shake .45s ease-in-out 2}.door-icon-wrap{animation:pop .45s both}.pulse-online{position:relative}.pulse-online:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--dl-green);box-shadow:0 0 20px var(--dl-green);animation:pulseDot 1.4s infinite}.alert{border-radius:18px!important;border:1px solid rgba(255,255,255,.14)!important;backdrop-filter:blur(14px)}@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes cardUp{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}@keyframes gridMove{to{background-position:44px 44px}}@keyframes spinGlow{to{transform:rotate(360deg)}}@keyframes floatGlow{50%{transform:translate(-20px,20px) scale(1.08)}}@keyframes orbPulse{50%{transform:translateY(-5px) scale(1.04);box-shadow:0 0 60px rgba(34,211,238,.85)}}@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 14px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}@media(max-width:991px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0!important}.stat-card{min-height:116px!important;padding:18px!important}.stat-value{font-size:2rem!important}}
</style>

</head>
<body>

<!-- ── Sidebar ────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-door-open-fill"></i>
        <span>DoorLink</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard/doorlink/admin" class="sidebar-link {% if page == 'home' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>

        <a href="/dashboard/doorlink/admin/users" class="sidebar-link {% if page == 'users' %}active{% endif %}">
            <i class="bi bi-people-fill"></i><span>Users</span>
        </a>

        <a href="/dashboard/doorlink/admin/logs" class="sidebar-link {% if page == 'logs' %}active{% endif %}">
            <i class="bi bi-journal-text"></i><span>Access Logs</span>
        </a>

        <a href="/dashboard/doorlink/admin/door" class="sidebar-link {% if page == 'door' %}active{% endif %}">
            <i class="bi bi-shield-lock-fill"></i><span>Door Open</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/docs" target="_blank" class="sidebar-link">
            <i class="bi bi-code-slash"></i><span>API Docs</span>
        </a>
        <a href="/dashboard/doorlink/logout" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i><span>Logout</span>
        </a>
    </div>
</aside>

<!-- ── Main Content ───────────────────────────────────────── -->
<main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
        <button class="btn btn-sm d-lg-none me-2" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
            <i class="bi bi-list fs-4"></i>
        </button>
        <h1 class="topbar-title">{% block page_title %}Dashboard{% endblock %}</h1>
        <div class="topbar-right">
            <span class="badge bg-light text-dark"><i class="bi bi-router-fill me-1"></i>DoorLink v0.3</span>
        </div>
    </header>

    <!-- Page Content -->
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Sidebar backdrop for mobile -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function(){
  const toggle=document.getElementById('sidebarToggle'),sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('sidebarBackdrop');
  if(toggle&&sidebar&&backdrop){toggle.addEventListener('click',()=>{sidebar.classList.toggle('open');backdrop.classList.toggle('show')});backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('show')})}
  document.querySelectorAll('.stat-value').forEach(el=>{const raw=(el.textContent||'').trim();const target=parseInt(raw.replace(/[^0-9]/g,''),10);if(Number.isNaN(target))return;let cur=0;const step=Math.max(1,Math.ceil(target/32));const tick=()=>{cur=Math.min(target,cur+step);el.textContent=cur;if(cur<target)requestAnimationFrame(tick)};el.textContent='0';setTimeout(tick,250)});
  document.querySelectorAll('form').forEach(form=>{form.addEventListener('submit',()=>{const btn=form.querySelector('button[type="submit"]');if(btn){btn.dataset.old=btn.innerHTML;btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Processing...';btn.disabled=true;}})});
})();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
